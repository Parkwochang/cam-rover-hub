name: Go checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --test scripts/control-ui.test.cjs
      - run: go test ./...
      - run: go vet ./...
      - run: bash scripts/check-architecture.sh
      - run: python3 -c "import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('vision').glob('*.py')]"
